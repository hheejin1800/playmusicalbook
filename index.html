<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공연 전 독서 체크방</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2a2622;--sub:#7a7268;--ac:#8b3a3a;--ac2:#e9d5d0;--bar:#ece6dd;--bd:#e4ddd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1917;--card:#262321;--tx:#f0ebe4;--sub:#a39a8e;--ac:#d98a7e;--ac2:#4a3330;--bar:#38332f;--bd:#3a3531}}
:root[data-theme="dark"]{--bg:#1b1917;--card:#262321;--tx:#f0ebe4;--sub:#a39a8e;--ac:#d98a7e;--ac2:#4a3330;--bar:#38332f;--bd:#3a3531}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.ghost{background:var(--ac2);color:var(--tx)}
button.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:8px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .3s}
input[type=range]{width:100%;accent-color:var(--ac)}
.big{font-size:28px;font-weight:700;color:var(--ac)}
.mem{display:grid;grid-template-columns:84px 1fr 42px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.mem span:last-child{text-align:right;color:var(--sub)}
.tag{display:inline-block;background:var(--ac2);border-radius:99px;padding:1px 8px;font-size:11px;margin-left:4px}
.code{font-family:ui-monospace,monospace;letter-spacing:2px;font-weight:700}
.hidden{display:none}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);width:min(90vw,420px);background:var(--ac);color:#fff;padding:16px 18px;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.28);text-align:center;font-weight:600;line-height:1.5;opacity:0;pointer-events:none;transition:.35s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast small{display:block;font-weight:400;opacity:.85;margin-top:2px}
</style>
</head>
<body>
<div id="toast"></div>
<main id="app"><p class="sub">불러오는 중…</p></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ▼▼ Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)에서 복사한 값으로 교체하세요 ▼▼
const firebaseConfig={
  apiKey:"AIzaSyBCl_pyehXDGYmlgrWQdcmcGUT4Z34Yh4Q",
  authDomain:"playmusicalbook.firebaseapp.com",
  projectId:"playmusicalbook",
  appId:"1:212423516795:web:34214caba483ad3d65b8de"
};
// ▲▲ ----------------------------------------------------------------- ▲▲

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,uid=null,code='',room=null,members=[],unsubs=[],roomMissing=false;
const getName=()=>{try{return localStorage.getItem('rr-name')||''}catch(e){return ''}};
const setName=n=>{try{localStorage.setItem('rr-name',n)}catch(e){}};
const D=p=>doc(db,p);

async function init(){
  if(!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith("YOUR_")){
    $('#app').innerHTML='<div class="card"><h2>Firebase 설정이 필요해요</h2><p class="sub">파일 위쪽의 firebaseConfig를 본인 Firebase 프로젝트 값으로 바꿔주세요.</p></div>';return}
  try{
    const app=initializeApp(firebaseConfig);
    db=getFirestore(app);
    uid=(await signInAnonymously(getAuth(app))).user.uid;
  }catch(e){
    $('#app').innerHTML='<div class="card"><h2>연결하지 못했어요</h2><p class="sub">'+esc(e.message)+'</p></div>';return}
  route();
}
window.addEventListener('hashchange',()=>db&&uid&&route());

function route(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];room=null;members=[];roomMissing=false;
  code=decodeURIComponent(location.hash.slice(1)).trim();
  code?roomView():homeView();
}
function homeView(){
  $('#app').innerHTML=`
  <h1>📚 공연 전 독서 체크방</h1>
  <p class="sub">공연의 원작을 얼마나 읽었는지 친구들과 함께 확인해요.</p>
  <div class="card">
    <h2>새 방 만들기</h2>
    <input type="text" id="pf" placeholder="공연 이름 (예: 뮤지컬 나르치스와 골드문트)">
    <input type="text" id="bk" placeholder="원작 책 제목 (예: 나르치스와 골드문트)">
    <input type="text" id="au" placeholder="저자 (선택)">
    <input type="text" id="nm" placeholder="내 이름" value="${esc(getName())}">
    <div class="row" style="margin-top:8px"><button id="mk">방 만들기</button></div>
  </div>
  <div class="card">
    <h2>초대 코드로 입장</h2>
    <div class="row"><input type="text" id="jc" placeholder="방 코드" style="flex:1"><button class="ghost" id="jn">입장</button></div>
  </div>`;
  $('#mk').onclick=async()=>{
    const t=$('#pf').value.trim(),b=$('#bk').value.trim(),n=$('#nm').value.trim();
    if(!t||!b||!n){alert('공연 이름, 책 제목, 내 이름을 입력해 주세요.');return}
    const c=Math.random().toString(36).slice(2,8);setName(n);
    try{
      await setDoc(D('rooms/'+c),{title:t,books:[{id:'b'+Date.now(),title:b,author:$('#au').value.trim()}],owner:uid});
      await setDoc(D(`rooms/${c}/members/${uid}`),{name:n,progress:{}});
      location.hash=c;
    }catch(e){alert('방을 만들지 못했어요: '+(e.message||e.code))}
  };
  $('#jn').onclick=()=>{const c=$('#jc').value.trim();if(c)location.hash=c};
}

function roomView(){
  $('#app').innerHTML=`
  <div class="row" style="justify-content:space-between"><a href="#" class="sub" onclick="location.hash='';return false">← 처음으로</a></div>
  <h1 id="rt">…</h1>
  <p class="sub">방 코드 <span class="code">${esc(code)}</span> · <span id="mc">0</span>명 참여 중</p>
  <div class="row"><button class="ghost sm" id="cp">🔗 초대 링크 복사</button></div>
  <div class="row" id="tools" style="margin-top:8px"></div>
  <div id="join"></div><div id="books"></div>
  <div class="card"><h2>책 추가하기</h2>
    <input type="text" id="nb" placeholder="책 제목"><input type="text" id="na" placeholder="저자 (선택)">
    <div class="row" style="margin-top:8px"><button id="ab">추가</button></div></div>`;
  $('#cp').onclick=async()=>{
    const url=location.href;
    try{await navigator.clipboard.writeText(url);$('#cp').textContent='✓ 복사됨'}
    catch(e){prompt('링크를 복사하세요',url)}
  };
  $('#ab').onclick=async()=>{
    const t=$('#nb').value.trim();if(!t||!room)return;
    const books=[...(room.books||[]),{id:'b'+Date.now(),title:t,author:$('#na').value.trim()}];
    try{await updateDoc(D('rooms/'+code),{books});$('#nb').value='';$('#na').value=''}catch(e){alert('추가하지 못했어요: '+(e.message||e.code))}
  };
  $('#books').addEventListener('input',e=>{
    if(e.target.matches('input[type=range]'))e.target.closest('.mine').querySelector('.pv').textContent=e.target.value+'%';
  });
  $('#books').addEventListener('change',e=>{
    if(e.target.matches('input[type=range]'))save(e.target.dataset.b,+e.target.value);
  });
  $('#books').addEventListener('click',e=>{
    const b=e.target.closest('button[data-b]');if(b)save(b.dataset.b,+b.dataset.v);
  });
  $('#books').addEventListener('click',async e=>{
    const x=e.target.closest('button[data-e]');if(!x||!room)return;
    const bk=(room.books||[]).find(y=>y.id===x.dataset.e);if(!bk)return;
    const t=prompt('책 제목',bk.title);if(t===null)return;
    if(!t.trim()){alert('책 제목은 비워둘 수 없어요.');return}
    const a=prompt('저자 (없으면 비워두세요)',bk.author||'');if(a===null)return;
    const books=room.books.map(y=>y.id===bk.id?{...y,title:t.trim(),author:a.trim()}:y);
    try{await updateDoc(D('rooms/'+code),{books})}catch(err){alert('수정하지 못했어요: '+(err.message||err.code))}
  });
  const fail=()=>{roomMissing=true;render()};
  unsubs.push(onSnapshot(D('rooms/'+code),s=>{if(!s.exists()){roomMissing=true}else{roomMissing=false;room=s.data()}render()},fail));
  unsubs.push(onSnapshot(collection(db,`rooms/${code}/members`),s=>{members=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
}

const MSGS=[
  "🎉 완독 축하해요! 이제 공연을 두 배로 즐길 수 있겠어요.",
  "📖 마지막 장까지 해냈어요! 객석에서 이야기가 더 깊게 보일 거예요.",
  "👏 원작을 다 읽었어요! 무대 위 장면이 머릿속 장면과 만나는 순간을 기대해요.",
  "✨ 완독 성공! 이제 공연에서 숨은 디테일을 찾아보세요.",
  "🎭 책 한 권을 끝냈어요! 커튼콜의 박수가 더 크게 나올 것 같아요."
];
let toastT=null;
function celebrate(title){
  const t=$('#toast');
  t.innerHTML=MSGS[Math.floor(Math.random()*MSGS.length)]+'<small>'+esc(title)+'</small>';
  t.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),5000);
}
document.addEventListener('click',e=>{if(e.target.closest('#toast'))$('#toast').classList.remove('show')});
async function save(bid,v){
  const m=members.find(x=>x.id===uid);if(!m)return;
  const prev=+((m.progress||{})[bid]||0);
  try{
    await setDoc(D(`rooms/${code}/members/${uid}`),{name:m.name,progress:{...(m.progress||{}),[bid]:v}});
    if(v===100&&prev<100){const bk=(room.books||[]).find(y=>y.id===bid);celebrate(bk?bk.title:'')}
  }catch(e){alert('저장하지 못했어요: '+(e.message||e.code))}
}

function render(){
  if(!$('#books'))return;
  if(roomMissing){$('#rt').textContent='방을 찾을 수 없어요';$('#books').innerHTML='';return}
  if(!room)return;
  $('#rt').textContent=room.title;$('#mc').textContent=members.length;
  const me=members.find(x=>x.id===uid);
  const j=$('#join');
  if(!me){
    if(!j.firstChild)j.innerHTML=`<div class="card"><h2>방에 참여하기</h2><input type="text" id="jnm" placeholder="내 이름" value="${esc(getName())}"><div class="row" style="margin-top:8px"><button id="jb">참여</button></div></div>`;
    $('#jb').onclick=async()=>{
      const n=$('#jnm').value.trim();if(!n)return;setName(n);
      try{await setDoc(D(`rooms/${code}/members/${uid}`),{name:n,progress:{}})}catch(e){alert('참여하지 못했어요: '+(e.message||e.code))}
    };
  }else j.innerHTML='';
  const t=$('#tools');
  if(me){
    const owner=room.owner===uid;
    t.innerHTML='<button class="ghost sm" id="rn">✏️ 닉네임 변경</button><button class="ghost sm" id="lv">🚪 방 나가기</button>'+(owner?'<button class="ghost sm" id="dl">🗑 방 삭제</button>':'');
    $('#rn').onclick=async()=>{
      const n=(prompt('새 닉네임을 입력하세요',me.name)||'').trim();
      if(!n||n===me.name)return;setName(n);
      try{await setDoc(D(`rooms/${code}/members/${uid}`),{name:n,progress:me.progress||{}})}catch(e){alert('변경하지 못했어요: '+(e.message||e.code))}
    };
    $('#lv').onclick=async()=>{
      if(!confirm('방에서 나갈까요? 내 진도 기록이 삭제돼요.'))return;
      try{await deleteDoc(D(`rooms/${code}/members/${uid}`));location.hash=''}catch(e){alert('나가지 못했어요: '+(e.message||e.code))}
    };
    if(owner)$('#dl').onclick=async()=>{
      if(!confirm('방을 완전히 삭제할까요? 모든 참여자의 기록이 사라지고 되돌릴 수 없어요.'))return;
      try{for(const m of members)await deleteDoc(D(`rooms/${code}/members/${m.id}`));await deleteDoc(D('rooms/'+code));location.hash=''}catch(e){alert('삭제하지 못했어요: '+(e.message||e.code))}
    };
  }else t.innerHTML='';
  $('#books').innerHTML=(room.books||[]).map(b=>{
    const vals=members.map(m=>+((m.progress||{})[b.id]||0));
    const avg=vals.length?Math.round(vals.reduce((a,c)=>a+c,0)/vals.length):0;
    const mine=me?+((me.progress||{})[b.id]||0):0;
    const list=[...members].sort((a,c)=>((c.progress||{})[b.id]||0)-((a.progress||{})[b.id]||0)).map(m=>{
      const p=+((m.progress||{})[b.id]||0);
      return `<div class="mem"><span>${esc(m.name)}${m.id===uid?'<b class="tag">나</b>':''}</span><div class="bar"><i style="width:${p}%"></i></div><span>${p}%</span></div>`}).join('');
    return `<div class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>${esc(b.title)}</h2><div class="sub">${esc(b.author||'')}</div></div><button class="ghost sm" data-e="${b.id}">✏️ 수정</button></div>
      <div class="row" style="margin:10px 0 4px;justify-content:space-between"><span class="sub">방 전체 평균</span><span class="big">${avg}%</span></div>
      <div class="bar"><i style="width:${avg}%"></i></div>
      ${me?`<div class="mine" style="margin-top:14px"><div class="row" style="justify-content:space-between"><span>내 진도</span><b class="pv">${mine}%</b></div>
        <input type="range" min="0" max="100" step="5" value="${mine}" data-b="${b.id}">
        <div class="row"><button class="ghost sm" data-b="${b.id}" data-v="0">안 읽음</button><button class="ghost sm" data-b="${b.id}" data-v="100">완독 ✓</button></div></div>`:''}
      <div style="margin-top:12px">${list}</div></div>`;
  }).join('');
}
init();
</script>
</body>
</html>
