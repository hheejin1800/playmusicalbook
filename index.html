<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공연 전 독서 체크방</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b0d12;--card:#42161e;--tx:#f6ead7;--sub:#c9a98a;--gold:#d4a853;--ac2:#5c2630;--bar:#25090e;--bd:#7a4538;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);background:radial-gradient(ellipse at 50% 0,#521824 0,#2b0d12 65%) fixed;min-height:100vh;font:16px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:calc(6px + env(safe-area-inset-top,0px));background:repeating-linear-gradient(90deg,#6b1523 0 16px,#8f1d30 16px 32px);border-bottom:2px solid var(--gold);z-index:50}
main{max-width:560px;margin:0 auto;padding:28px 16px 70px}
h1,h2,.big{font-family:"Noto Serif KR",Georgia,serif}
h1{font-size:24px;margin:6px 0 2px;color:var(--gold);line-height:1.35}
h1::after{content:"";display:block;width:56px;height:2px;background:var(--gold);margin-top:10px}
h2{font-size:18px;margin:0}
a{color:var(--gold)}
.sub{color:var(--sub);font-size:13px}
.card{background:linear-gradient(180deg,#4a1a23,var(--card));border:1px solid var(--bd);border-radius:14px;padding:18px 16px;margin:16px 0;box-shadow:0 4px 18px rgba(0,0,0,.25)}
input[type=text],input[type=date]{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#2f0f15;color:var(--tx);font:inherit;margin:5px 0}
input[type=date]{width:auto;min-height:40px;margin:0}
label.l{display:block;font-size:12px;color:var(--sub);margin-top:6px}
button{font:inherit;font-weight:600;border:1px solid var(--gold);border-radius:10px;min-height:44px;padding:9px 16px;background:var(--gold);color:#2b0d12;cursor:pointer}
button.ghost{background:transparent;color:var(--gold)}
button.sm{min-height:40px;padding:6px 12px;font-size:14px}
button:active{transform:scale(.97)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:10px;background:var(--bar);border-radius:99px;overflow:hidden;border:1px solid #5a2a2a}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#a9792f,var(--gold));border-radius:99px;transition:width .4s}
.bar i.done{background:linear-gradient(90deg,#f3d27a,#fff3c4,#f3d27a);background-size:200% 100%;animation:sh 2.2s linear infinite;box-shadow:0 0 10px #f3d27a}
@keyframes sh{to{background-position:-200% 0}}
input[type=range]{width:100%;height:38px;accent-color:var(--gold)}
.big{font-size:30px;font-weight:700;color:var(--gold)}
.bk{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.cv{width:64px;height:92px;flex:none;border-radius:6px;border:1px solid var(--gold);background:var(--ac2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cv:empty::before{content:"📖";font-size:26px}
.cv img{width:100%;height:100%;object-fit:cover}
.mem{display:grid;grid-template-columns:86px 1fr 46px;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.mem span:last-child{text-align:right;color:var(--sub)}
.tag{display:inline-block;background:var(--ac2);color:var(--gold);border-radius:99px;padding:1px 8px;font-size:11px;margin-left:4px}
.code{font-family:ui-monospace,monospace;letter-spacing:2px;font-weight:700;color:var(--gold)}
.dd{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--gold);border-radius:12px;background:rgba(212,168,83,.1);text-align:center}
.dd b{font-family:"Noto Serif KR",serif;font-size:26px;color:var(--gold);margin:0 6px}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);width:min(90vw,420px);background:var(--gold);color:#2b0d12;padding:16px 18px;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.45);text-align:center;font-weight:600;opacity:0;pointer-events:none;transition:.35s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast small{display:block;font-weight:400;opacity:.8;margin-top:2px}
</style>
</head>
<body>
<div id="toast"></div>
<main id="app"><p class="sub">불러오는 중…</p></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBCl_pyehXDGYmlgrWQdcmcGUT4Z34Yh4Q",
  authDomain:"playmusicalbook.firebaseapp.com",
  projectId:"playmusicalbook",
  appId:"1:212423516795:web:34214caba483ad3d65b8de"
};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const okUrl=u=>{u=(u||'').trim();return /^https?:\/\//i.test(u)?u:''};
let db=null,uid=null,code='',room=null,members=[],unsubs=[],roomMissing=false;
const getName=()=>{try{return localStorage.getItem('rr-name')||''}catch(e){return ''}};
const setName=n=>{try{localStorage.setItem('rr-name',n)}catch(e){}};
const D=p=>doc(db,p);

const MSGS=[
  "🎉 완독 축하해요! 이제 공연을 두 배로 즐길 수 있겠어요.",
  "📖 마지막 장까지 해냈어요! 객석에서 이야기가 더 깊게 보일 거예요.",
  "👏 원작을 다 읽었어요! 무대 위 장면이 머릿속 장면과 만나는 순간을 기대해요.",
  "✨ 완독 성공! 이제 공연에서 숨은 디테일을 찾아보세요.",
  "🎭 책 한 권을 끝냈어요! 커튼콜의 박수가 더 크게 나올 것 같아요."
];
let toastT=null;
function celebrate(title){
  const t=$('#toast');
  t.innerHTML=MSGS[Math.floor(Math.random()*MSGS.length)]+'<small>'+esc(title)+'</small>';
  t.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),5000);
}
document.addEventListener('click',e=>{if(e.target.closest('#toast'))$('#toast').classList.remove('show')});

function ddayHtml(d){
  if(!d)return '';
  const [y,m,da]=d.split('-').map(Number);
  const n=new Date();n.setHours(0,0,0,0);
  const diff=Math.round((new Date(y,m-1,da)-n)/864e5);
  if(diff>0)return `🎭 공연까지 <b>D-${diff}</b><div class="sub">${esc(d)}</div>`;
  if(diff===0)return `🎭 오늘이 공연날! <b>D-DAY</b>`;
  return `공연이 끝났어요 <b>D+${-diff}</b><div class="sub">${esc(d)}</div>`;
}

async function init(){
  try{
    const app=initializeApp(firebaseConfig);
    db=getFirestore(app);
    uid=(await signInAnonymously(getAuth(app))).user.uid;
  }catch(e){
    $('#app').innerHTML='<div class="card"><h2>연결하지 못했어요</h2><p class="sub">'+esc(e.message)+'</p></div>';return}
  route();
}
window.addEventListener('hashchange',()=>db&&uid&&route());

function route(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];room=null;members=[];roomMissing=false;
  code=decodeURIComponent(location.hash.slice(1)).trim();
  code?roomView():homeView();
}

function homeView(){
  $('#app').innerHTML=`
  <h1>📚 공연 전 독서 체크방</h1>
  <p class="sub">공연의 원작을 얼마나 읽었는지 친구들과 함께 확인해요.</p>
  <div class="card">
    <h2>새 방 만들기</h2>
    <input type="text" id="pf" placeholder="공연 이름 (예: 뮤지컬 나르치스와 골드문트)">
    <label class="l">공연 날짜 (선택)</label><input type="date" id="dd">
    <input type="text" id="bk" placeholder="원작 책 제목">
    <input type="text" id="au" placeholder="저자 (선택)">
    <input type="text" id="cv" placeholder="표지 이미지 주소 (선택, https://…)">
    <input type="text" id="nm" placeholder="내 이름" value="${esc(getName())}">
    <div class="row" style="margin-top:10px"><button id="mk">방 만들기</button></div>
  </div>
  <div class="card">
    <h2>초대 코드로 입장</h2>
    <div class="row"><input type="text" id="jc" placeholder="방 코드" style="flex:1"><button class="ghost" id="jn">입장</button></div>
  </div>`;
  $('#mk').onclick=async()=>{
    const t=$('#pf').value.trim(),b=$('#bk').value.trim(),n=$('#nm').value.trim();
    if(!t||!b||!n){alert('공연 이름, 책 제목, 내 이름을 입력해 주세요.');return}
    const c=Math.random().toString(36).slice(2,8);setName(n);
    try{
      await setDoc(D('rooms/'+c),{title:t,date:$('#dd').value||'',books:[{id:'b'+Date.now(),title:b,author:$('#au').value.trim(),cover:okUrl($('#cv').value)}],owner:uid});
      await setDoc(D(`rooms/${c}/members/${uid}`),{name:n,progress:{}});
      location.hash=c;
    }catch(e){alert('방을 만들지 못했어요: '+(e.message||e.code))}
  };
  $('#jn').onclick=()=>{const c=$('#jc').value.trim();if(c)location.hash=c};
}

function roomView(){
  $('#app').innerHTML=`
  <a href="#" class="sub" onclick="location.hash='';return false">← 처음으로</a>
  <h1 id="rt">…</h1>
  <p class="sub">방 코드 <span class="code">${esc(code)}</span> · <span id="mc">0</span>명 참여 중</p>
  <div id="dday"></div>
  <div class="row" style="margin-top:10px"><button class="ghost sm" id="cp">🔗 초대 링크 복사</button></div>
  <div class="row" id="tools" style="margin-top:8px"></div>
  <div id="join"></div><div id="books"></div>
  <div class="card"><h2>책 추가하기</h2>
    <input type="text" id="nb" placeholder="책 제목"><input type="text" id="na" placeholder="저자 (선택)"><input type="text" id="nc" placeholder="표지 이미지 주소 (선택)">
    <div class="row" style="margin-top:10px"><button id="ab">추가</button></div></div>`;
  $('#cp').onclick=async()=>{
    const url=location.href;
    try{await navigator.clipboard.writeText(url);$('#cp').textContent='✓ 복사됨'}
    catch(e){prompt('링크를 복사하세요',url)}
  };
  $('#ab').onclick=async()=>{
    const t=$('#nb').value.trim();if(!t||!room)return;
    const books=[...(room.books||[]),{id:'b'+Date.now(),title:t,author:$('#na').value.trim(),cover:okUrl($('#nc').value)}];
    try{await updateDoc(D('rooms/'+code),{books});$('#nb').value='';$('#na').value='';$('#nc').value=''}catch(e){alert('추가하지 못했어요: '+(e.message||e.code))}
  };
  const B=$('#books');
  B.addEventListener('input',e=>{
    if(e.target.matches('input[type=range]'))e.target.closest('.mine').querySelector('.pv').textContent=e.target.value+'%';
  });
  B.addEventListener('change',e=>{
    if(e.target.matches('input[type=range]'))save(e.target.dataset.b,+e.target.value);
  });
  B.addEventListener('click',async e=>{
    const b=e.target.closest('button[data-b]');if(b){save(b.dataset.b,+b.dataset.v);return}
    const x=e.target.closest('button[data-e]');if(!x||!room)return;
    const bk=(room.books||[]).find(y=>y.id===x.dataset.e);if(!bk)return;
    const t=prompt('책 제목',bk.title);if(t===null)return;
    if(!t.trim()){alert('책 제목은 비워둘 수 없어요.');return}
    const a=prompt('저자 (없으면 비워두세요)',bk.author||'');if(a===null)return;
    const c=prompt('표지 이미지 주소 (없으면 비워두세요)',bk.cover||'');if(c===null)return;
    const books=room.books.map(y=>y.id===bk.id?{...y,title:t.trim(),author:a.trim(),cover:okUrl(c)}:y);
    try{await updateDoc(D('rooms/'+code),{books})}catch(err){alert('수정하지 못했어요: '+(err.message||err.code))}
  });
  const fail=()=>{roomMissing=true;render()};
  unsubs.push(onSnapshot(D('rooms/'+code),s=>{if(!s.exists()){roomMissing=true}else{roomMissing=false;room=s.data()}render()},fail));
  unsubs.push(onSnapshot(collection(db,`rooms/${code}/members`),s=>{members=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
}

async function save(bid,v){
  const m=members.find(x=>x.id===uid);if(!m)return;
  const prev=+((m.progress||{})[bid]||0);
  try{
    await setDoc(D(`rooms/${code}/members/${uid}`),{name:m.name,progress:{...(m.progress||{}),[bid]:v}});
    if(v===100&&prev<100){const bk=(room.books||[]).find(y=>y.id===bid);celebrate(bk?bk.title:'')}
  }catch(e){alert('저장하지 못했어요: '+(e.message||e.code))}
}

function render(){
  if(!$('#books'))return;
  if(roomMissing){$('#rt').textContent='방을 찾을 수 없어요';$('#books').innerHTML='';return}
  if(!room)return;
  $('#rt').textContent=room.title;$('#mc').textContent=members.length;
  const dd=ddayHtml(room.date);$('#dday').innerHTML=dd?`<div class="dd">${dd}</div>`:'';
  const me=members.find(x=>x.id===uid);
  const j=$('#join');
  if(!me){
    if(!j.firstChild)j.innerHTML=`<div class="card"><h2>방에 참여하기</h2><input type="text" id="jnm" placeholder="내 이름" value="${esc(getName())}"><div class="row" style="margin-top:10px"><button id="jb">참여</button></div></div>`;
    $('#jb').onclick=async()=>{
      const n=$('#jnm').value.trim();if(!n)return;setName(n);
      try{await setDoc(D(`rooms/${code}/members/${uid}`),{name:n,progress:{}})}catch(e){alert('참여하지 못했어요: '+(e.message||e.code))}
    };
  }else j.innerHTML='';
  const t=$('#tools');
  const sig=me?[me.name,room.owner===uid,room.date||''].join('|'):'';
  if(t.dataset.sig!==sig){
    t.dataset.sig=sig;
    if(!me)t.innerHTML='';
    else{
      const owner=room.owner===uid;
      t.innerHTML='<button class="ghost sm" id="rn">✏️ 닉네임 변경</button><button class="ghost sm" id="lv">🚪 방 나가기</button>'+(owner?'<button class="ghost sm" id="dl">🗑 방 삭제</button>':'')+`<span class="sub">📅 공연일</span><input type="date" id="dt" value="${esc(room.date||'')}">`;
      $('#dt').onchange=async e=>{try{await updateDoc(D('rooms/'+code),{date:e.target.value})}catch(err){alert('날짜를 저장하지 못했어요: '+(err.message||err.code))}};
      $('#rn').onclick=async()=>{
        const n=(prompt('새 닉네임을 입력하세요',me.name)||'').trim();
        if(!n||n===me.name)return;setName(n);
        try{await setDoc(D(`rooms/${code}/members/${uid}`),{name:n,progress:me.progress||{}})}catch(e){alert('변경하지 못했어요: '+(e.message||e.code))}
      };
      $('#lv').onclick=async()=>{
        if(!confirm('방에서 나갈까요? 내 진도 기록이 삭제돼요.'))return;
        try{await deleteDoc(D(`rooms/${code}/members/${uid}`));location.hash=''}catch(e){alert('나가지 못했어요: '+(e.message||e.code))}
      };
      if(owner)$('#dl').onclick=async()=>{
        if(!confirm('방을 완전히 삭제할까요? 모든 참여자의 기록이 사라지고 되돌릴 수 없어요.'))return;
        try{for(const m of members)await deleteDoc(D(`rooms/${code}/members/${m.id}`));await deleteDoc(D('rooms/'+code));location.hash=''}catch(e){alert('삭제하지 못했어요: '+(e.message||e.code))}
      };
    }
  }
  $('#books').innerHTML=(room.books||[]).map(b=>{
    const vals=members.map(m=>+((m.progress||{})[b.id]||0));
    const avg=vals.length?Math.round(vals.reduce((a,c)=>a+c,0)/vals.length):0;
    const mine=me?+((me.progress||{})[b.id]||0):0;
    const list=[...members].sort((a,c)=>((c.progress||{})[b.id]||0)-((a.progress||{})[b.id]||0)).map(m=>{
      const p=+((m.progress||{})[b.id]||0);
      return `<div class="mem"><span>${esc(m.name)}${m.id===uid?'<b class="tag">나</b>':''}</span><div class="bar"><i class="${p>=100?'done':''}" style="width:${p}%"></i></div><span>${p>=100?'✓':p+'%'}</span></div>`}).join('');
    return `<div class="card">
      <div class="bk"><div class="cv">${b.cover?`<img src="${esc(b.cover)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>
        <div style="flex:1;min-width:0"><h2>${esc(b.title)}</h2><div class="sub">${esc(b.author||'')}</div></div>
        <button class="ghost sm" data-e="${b.id}">✏️ 수정</button></div>
      <div class="row" style="margin:14px 0 6px;justify-content:space-between"><span class="sub">방 전체 평균</span><span class="big">${avg}%</span></div>
      <div class="bar"><i class="${avg>=100?'done':''}" style="width:${avg}%"></i></div>
      ${me?`<div class="mine" style="margin-top:16px"><div class="row" style="justify-content:space-between"><span>내 진도 ${mine>=100?'🏅 완독!':''}</span><b class="pv">${mine}%</b></div>
        <input type="range" min="0" max="100" step="5" value="${mine}" data-b="${b.id}">
        <div class="row"><button class="ghost sm" data-b="${b.id}" data-v="0">안 읽음</button><button class="sm" data-b="${b.id}" data-v="100">완독 ✓</button></div></div>`:''}
      <div style="margin-top:14px">${list}</div></div>`;
  }).join('');
}
init();
</script>
</body>
</html>
